spring.application.name=usage-service
server.port = 8083

# Actuator & Prometheus (scraped by Prometheus in docker-compose)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=${spring.application.name}


# ===== DATABASE =====
spring.datasource.url=jdbc:mysql://localhost:3306/usage_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=yourpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ===== FLYWAY =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

#Kafka - consumer
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.consumer.group-id=usage-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
#spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer


# delegate deserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserialize
spring.kafka.consumer.properties.spring.json.type.mapping=energyUsageEvent:com.glazowr.kafka.event.EnergyUsageEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record


# Kafka Producer (required for retry/DLT publishing)
spring.kafka.template.default-topic=energy-alerts
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer


#Influx DB Configuration
influx.url=http://localhost:8072
influx.token=my-token
influx.org=glazowr
influx.bucket=usage-bucket


device.service.url=http://localhost:8081/api/v1/device
user.service.url=http://localhost:8080/api/v1/user

# Redis cache
spring.cache.type=redis
spring.cache.cache-names=usageDeviceById,usageDevicesByUserId, userById
spring.cache.redis.cache-null-values=false
spring.cache.redis.time-to-live=2m

# Because your services run on the host and Redis runs in Docker
spring.data.redis.host=localhost
spring.data.redis.port=6379
